{% extends "base.html" %}
{% block title %}Cambiar contraseña · Nexora{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('dashboard') }}">← Volver al panel</a>
<section class="form-card">
  <div class="eyebrow">SEGURIDAD DE LA CUENTA</div>
  <h1>Cambiar contraseña</h1>
  <p class="muted">Usa una contraseña nueva de al menos 12 caracteres.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Contraseña actual
      <input name="current_password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <label>Nueva contraseña
      <input name="password" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <label>Confirma la contraseña nueva
      <input name="confirmation" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <div class="form-actions">
      <button class="button button-primary" type="submit">Actualizar contraseña</button>
    </div>
  </form>
</section>
{% endblock %}
